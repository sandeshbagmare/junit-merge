[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "junit-merge"
version = "0.1.1"
description = "Merge JUnit XML reports from sharded or retried test runs, recomputing counts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sandesh Bagmare" }]
keywords = ["junit", "junitxml", "ci", "pytest", "merge", "test-report"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sandeshbagmare/junit-merge"
Issues = "https://github.com/sandeshbagmare/junit-merge/issues"
Changelog = "https://github.com/sandeshbagmare/junit-merge/blob/main/CHANGELOG.md"

[project.scripts]
junit-merge = "junit_merge.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/junit_merge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
